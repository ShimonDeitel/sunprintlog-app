name: SunprintLog
options:
  bundleIdPrefix: com.shimondeitel.sunprintlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  SunprintLog:
    type: application
    platform: iOS
    sources:
      - path: SunprintLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.sunprintlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SunprintLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  SunprintLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SunprintLogTests
      - path: SunprintLog.storekit
    dependencies:
      - target: SunprintLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.sunprintlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  SunprintLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SunprintLogUITests
    dependencies:
      - target: SunprintLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.sunprintlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SunprintLog:
    build:
      targets:
        SunprintLog: all
        SunprintLogTests: [test]
        SunprintLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SunprintLog.storekit
    test:
      config: Debug
      storeKitConfiguration: SunprintLog.storekit
      targets:
        - SunprintLogTests
        - SunprintLogUITests
    archive:
      config: Release
